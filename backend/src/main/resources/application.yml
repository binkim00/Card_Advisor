server:
  address: 127.0.0.1
  port: 18080
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:54329/card_advisor}
    username: ${DB_USER:card_advisor}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  flyway:
    enabled: true
logging:
  level:
    root: INFO
    org.springframework.web: WARN


codef:
  config-file: ${CODEF_CONFIG_FILE:}
  storage-key-file: ${CODEF_STORAGE_KEY_FILE:}

openai:
  config-file: ${OPENAI_CONFIG_FILE:}

account:
  mail-config-file: ${ACCOUNT_MAIL_CONFIG_FILE:}
