name: card-advisor
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: card_advisor
      POSTGRES_USER: card_advisor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/configure.ps1 first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - card_advisor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card_advisor -d card_advisor"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  card_advisor_pg:

